
spring:
  application:
    name: infraxen-api

  datasource:
    url: jdbc:postgresql://localhost:5433/infraxen
    username: ${POSTGRES_USER:infraxen_user}
    password: ${POSTGRES_PASSWORD:InfraXenLocalDB_2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:infraxen_user}
    password: ${RABBITMQ_PASSWORD:InfraXenLocalMQ_2026}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

